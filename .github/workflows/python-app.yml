name: KeyStride CI/CD

on:
  # 推送到 main 时运行
  push:
    branches: ["main"]

  # Pull Request 时运行
  pull_request:
    branches: ["main"]

  # 推送 v1.0.0、v1.2.3 之类的 Tag 时运行
  tags:
    - "v*"

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. 构建、代码检查、单元测试、EXE 打包
  # ============================================================
  build:
    name: Build and Test
    runs-on: windows-latest

    steps:

      # --------------------------------------------------------
      # 获取源代码
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python 环境
      # --------------------------------------------------------
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # --------------------------------------------------------
      # 安装依赖
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pyinstaller
          pip install -r requirements.txt

      # --------------------------------------------------------
      # Flake8 代码检查
      # --------------------------------------------------------
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # --------------------------------------------------------
      # pytest 测试
      # --------------------------------------------------------
      - name: Test with pytest
        run: |
          $env:PYTHONPATH = "$PWD"
          pytest

      # --------------------------------------------------------
      # PyInstaller 打包
      #
      # 如果你的主程序入口不是 main.py，
      # 把下面的 main.py 改成真正的入口文件。
      # --------------------------------------------------------
      - name: Build EXE
        run: |
          pyinstaller --onefile --name KeyStride main.py

      # --------------------------------------------------------
      # 上传 EXE 到当前 Actions 运行
      # --------------------------------------------------------
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyStride-windows
          path: dist/KeyStride.exe


  # ============================================================
  # 2. Python 安全检测
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 获取源代码
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python 环境
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # --------------------------------------------------------
      # 安装安全扫描工具
      # --------------------------------------------------------
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      # --------------------------------------------------------
      # Bandit
      # Python 静态安全检查
      # --------------------------------------------------------
      - name: Run Bandit
        run: |
          bandit -r . -x tests

      # --------------------------------------------------------
      # pip-audit
      # 检查第三方 Python 依赖已知漏洞
      # --------------------------------------------------------
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt


  # ============================================================
  # 3. 自动发布 GitHub Release
  #
  # 只有打 Tag，例如：
  #
  # git tag v1.0.0
  # git push origin v1.0.0
  #
  # 才会执行。
  # ============================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest

    needs:
      - build
      - security

    # 只有 v* Tag 才发布
    if: startsWith(github.ref, 'refs/tags/v')

    # Release 需要写权限
    permissions:
      contents: write

    steps:

      # --------------------------------------------------------
      # 下载 build Job 生成的 EXE
      # --------------------------------------------------------
      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: KeyStride-windows
          path: release

      # --------------------------------------------------------
      # 查看文件
      # --------------------------------------------------------
      - name: List release files
        run: |
          ls -R release

      # --------------------------------------------------------
      # 创建 GitHub Release
      #
      # 使用 GitHub 自带的 gh CLI
      # --------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "release/KeyStride.exe" \
            --title "KeyStride ${{ github.ref_name }}" \
            --generate-notes
