name: KeyStride CI/CD

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"

  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. 构建、代码检查、测试、EXE 打包
  # ============================================================
  build:
    name: Build and Test
    runs-on: windows-latest

    steps:

      # 获取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # 安装项目依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pyinstaller
          pip install -r requirements.txt

      # Flake8 代码检查
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # pytest
      - name: Test with pytest
        run: |
          $env:PYTHONPATH = "$PWD"
          pytest

      # PyInstaller
      - name: Build EXE
        run: |
          pyinstaller --onefile --name KeyStride main.py

      # 上传 EXE Artifact
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyStride-windows
          path: dist/KeyStride.exe


  # ============================================================
  # 2. 安全检测
  # ============================================================
  security:
    name: Security Scan
    runs-on: windows-latest

    steps:

      # 获取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置 Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # 安装项目依赖 + 安全工具
      - name: Install security tools and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -r requirements.txt

      # Bandit
      # Medium / High 才阻止 CI
      # Low 级别只作为提示，不阻止构建
      - name: Run Bandit
        run: |
          bandit -r . -x tests --severity-level medium

      # pip-audit
      # 检查 requirements.txt 中第三方依赖的已知漏洞
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt


  # ============================================================
  # 3. 自动发布 GitHub Release
  # ============================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build
      - security

    # 只有 v* Tag 才执行 Release
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:

      # 下载 build Job 生成的 EXE
      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: KeyStride-windows
          path: release

      # 查看生成的文件
      - name: List release files
        run: |
          ls -R release

      # 创建 GitHub Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "release/KeyStride.exe" \
            --title "KeyStride ${{ github.ref_name }}" \
            --generate-notes
